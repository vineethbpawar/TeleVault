<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>TeleVault</title>

    <!-- PWA & iOS Safari Standalone Meta Tags -->
    <meta name="theme-color" content="#0B0E1B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TeleVault" />

    <!-- PWA Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Service Worker Cleanup (Unregistered per AGENTS.md PWA Guidelines) -->
    <script>
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var registration of registrations) {
              registration.unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) {
              caches.delete(name);
            }
          });
        }
      } catch (e) {}
    </script>

    <!-- The `react-native-web` recommended style reset and premium visual enhancements -->
    <style id="expo-reset">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

      html,
      body {
        height: 100%;
        height: -webkit-fill-available;
        margin: 0;
        padding: 0;
        background-color: #0b0e1b;
        overscroll-behavior-y: contain; /* Disable pull-to-refresh */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Force premium Outfit font across all React Native Web DOM nodes */
      div, span, p, input, textarea, button, a {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }

      /* Disable default browser tap-highlights & outline rings */
      * {
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        height: -webkit-fill-available;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
